<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kedai Kekinian • Kasir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{--bg1:#fcf3e9;--bg2:#ffded0;--card:#fff5eb;--border:#ffd4be;--dark:#3d2b1f;--light:#8a6a52;--a1:#f75c3c;--a2:#ff914d;--soft:#ffede5;--grad:linear-gradient(135deg,var(--a1),var(--a2))}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
  body{background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;padding:20px}
  .wrap{max-width:1100px;margin:0 auto}
  .card{background:var(--card);border:1.5px solid var(--border);border-radius:22px;padding:16px;margin-bottom:14px}
  h1{font-size:20px;font-weight:900;color:var(--dark)}
  h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  p.tag{color:var(--light);font-size:12px;font-weight:700;margin-top:2px}
  input,select{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:11px 14px;font-size:14px;font-weight:600;color:var(--dark);margin-bottom:8px;outline:none;font-family:inherit}
  .btn{padding:12px 18px;border:none;border-radius:60px;font-weight:900;font-size:13px;cursor:pointer;background:var(--grad);color:#fff}
  .btn.ghost{background:#fff;color:var(--dark);border:1.5px dashed var(--border)}
  .btn.danger{background:#dc3545;color:#fff}
  .btn.block{width:100%}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:60px;margin-bottom:14px}
  .tab{flex:1;background:transparent;border:none;padding:10px 8px;border-radius:60px;font-weight:800;font-size:12px;color:var(--light);cursor:pointer}
  .tab.active{background:#fff;color:var(--a1)}
  .panel{display:none}.panel.active{display:block}
  .grid{display:grid;grid-template-columns:1fr 380px;gap:16px}
  .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .item{background:#fff;border:1.5px solid var(--border);border-radius:18px;padding:12px;text-align:center;cursor:pointer;position:relative}
  .item .em{font-size:30px;display:block;margin-bottom:6px}
  .item .nm{font-weight:700;font-size:12px;min-height:32px}
  .item .hg{font-weight:800;color:var(--a1);font-size:12px;background:var(--soft);padding:3px 10px;border-radius:60px;display:inline-block;margin-top:4px}
  .item.out{opacity:.4}
  .stok-tag{position:absolute;top:6px;right:6px;font-size:9px;font-weight:900;background:var(--soft);color:var(--a1);padding:2px 7px;border-radius:60px}
  .cart-line{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:8px 12px;margin-bottom:6px;font-size:13px}
  .cart-line .qty{margin-left:auto;display:flex;align-items:center;gap:6px}
  .cart-line .qty button{border:none;background:var(--soft);width:24px;height:24px;border-radius:50%;font-weight:900;color:var(--a1);cursor:pointer}
  .total{display:flex;justify-content:space-between;font-weight:900;font-size:20px;margin:10px 0}
  .menurow{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:10px 12px;margin-bottom:8px}
  .menurow input{margin:0;width:auto;flex:1}
  .menurow .em-in{width:46px;text-align:center;flex:none}
  .menurow .num{width:80px;flex:none}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f1510;color:#fde3d0;padding:10px 20px;border-radius:60px;font-size:13px;font-weight:700;z-index:999}
  .badge-role{font-size:10px;font-weight:900;text-transform:uppercase;background:var(--soft);color:var(--a1);padding:2px 10px;border-radius:60px}
  @media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div class="card" id="authBox" style="max-width:380px;margin:60px auto">
    <h1>Kedai <span>Kekinian</span></h1>
    <p class="tag">Login staff (kasir / admin / owner)</p>
    <input id="lUser" placeholder="Username" style="margin-top:14px">
    <input id="lPass" type="password" placeholder="Password">
    <button class="btn block" id="loginBtn">MASUK 🚀</button>
    <p class="tag" style="margin-top:10px">Demo: owner/owner123 • admin/admin123 • kasir/kasir123</p>
  </div>

  <!-- APP -->
  <div id="app" style="display:none">
    <div class="card row" style="justify-content:space-between;align-items:center">
      <div><h1 style="font-size:16px">Kasir Kedai</h1><p class="tag" id="whoLine"></p></div>
      <button class="btn ghost" id="logoutBtn">Logout</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="kasir">🛒 Kasir</button>
      <button class="tab" id="tabMenuBtn" data-tab="menu" style="display:none">📋 Kelola Menu</button>
      <button class="tab" data-tab="riwayat">🧾 Riwayat</button>
    </div>

    <!-- KASIR -->
    <div class="panel active" id="p-kasir">
      <div class="grid">
        <div class="card"><div class="menu-grid" id="menuGrid"></div></div>
        <div class="card">
          <h1 style="font-size:14px">🛒 Keranjang</h1>
          <input id="squadName" placeholder="Nama pelanggan (opsional)" style="margin-top:8px">
          <div id="cartList" style="margin-top:8px"></div>
          <div class="total"><span>Total</span><span id="cartTotal">Rp 0</span></div>
          <button class="btn block" id="checkoutBtn">✅ BAYAR</button>
        </div>
      </div>
    </div>

    <!-- KELOLA MENU (admin/owner) -->
    <div class="panel" id="p-menu">
      <div class="card">
        <h1 style="font-size:15px">➕ Tambah Menu Baru</h1>
        <div class="row" style="margin-top:10px">
          <input id="newEmoji" placeholder="🍩" style="max-width:70px;text-align:center">
          <input id="newNama" placeholder="Nama menu" style="flex:1;min-width:150px">
          <input id="newHarga" type="number" placeholder="Harga" style="max-width:120px">
          <input id="newStok" type="number" placeholder="Stok" style="max-width:100px">
          <button class="btn" id="addMenuBtn">Tambah</button>
        </div>
      </div>
      <div class="card">
        <h1 style="font-size:15px">📋 Daftar Menu</h1>
        <div id="menuManageList" style="margin-top:10px"></div>
      </div>
    </div>

    <!-- RIWAYAT -->
    <div class="panel" id="p-riwayat">
      <div class="card" id="riwayatArea"></div>
    </div>
  </div>
</div>

<script>
// =========================================================
// ISI DENGAN CREDENTIAL SUPABASE PROJECT KAMU (SAMA seperti pelanggan.html)
// =========================================================
const SUPABASE_URL = "https://GANTI-INI.supabase.co";
const SUPABASE_ANON_KEY = "GANTI-DENGAN-ANON-PUBLIC-KEY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
let staff = null;
let menu = [];
let cart = [];

function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2200);
}
function rupiah(n){return 'Rp '+Number(n).toLocaleString('id-ID');}

// ============ LOGIN ============
$('loginBtn').addEventListener('click', async ()=>{
  const u=$('lUser').value.trim(), p=$('lPass').value;
  const {data,error} = await sb.from('staff').select('*').eq('username',u).eq('password',p).maybeSingle();
  if(error||!data){ toast('❌ Login gagal'); return; }
  staff=data; localStorage.setItem('kedai_staff_id', staff.id);
  startApp();
});
$('logoutBtn').addEventListener('click', ()=>{
  localStorage.removeItem('kedai_staff_id');
  staff=null; cart=[];
  $('app').style.display='none'; $('authBox').style.display='block';
});
(async function initSession(){
  const sid = localStorage.getItem('kedai_staff_id');
  if(sid){
    const {data} = await sb.from('staff').select('*').eq('id',sid).maybeSingle();
    if(data){ staff=data; startApp(); }
  }
})();

async function startApp(){
  $('authBox').style.display='none';
  $('app').style.display='block';
  $('whoLine').innerHTML = `${staff.name} <span class="badge-role">${staff.role}</span>`;
  const canManageMenu = staff.role==='admin' || staff.role==='owner';
  $('tabMenuBtn').style.display = canManageMenu ? 'block' : 'none';
  await loadMenu();
  await renderRiwayat();
}

// ============ TABS ============
document.querySelectorAll('[data-tab]').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  $('p-'+t.dataset.tab).classList.add('active');
  if(t.dataset.tab==='menu') renderMenuManage();
  if(t.dataset.tab==='riwayat') renderRiwayat();
}));

// ============ MENU (kasir side) ============
async function loadMenu(){
  const {data} = await sb.from('menu_items').select('*').order('id');
  menu = data || [];
  $('menuGrid').innerHTML = menu.filter(m=>m.aktif).map(m=>`
    <div class="item ${m.stok<=0?'out':''}" data-id="${m.id}">
      <span class="stok-tag">${m.stok<=0?'Habis':m.stok}</span>
      <span class="em">${m.emoji||'🍽️'}</span>
      <div class="nm">${m.nama}</div>
      <div class="hg">Rp ${(m.harga/1000)}k</div>
    </div>`).join('');
  $('menuGrid').querySelectorAll('.item').forEach(el=>el.addEventListener('click',()=>{
    const id=parseInt(el.dataset.id);
    const item=menu.find(x=>x.id===id);
    if(!item||item.stok<=0)return;
    const ex=cart.find(c=>c.id===id);
    if(ex){ if(ex.qty>=item.stok){toast('📦 Stok habis');return;} ex.qty++; }
    else cart.push({...item,qty:1});
    renderCart();
  }));
}
function renderCart(){
  $('cartList').innerHTML = cart.length===0 ? '<p class="tag">Keranjang kosong</p>' : cart.map(c=>`
    <div class="cart-line">
      <span>${c.emoji} ${c.nama}</span>
      <div class="qty">
        <button data-act="minus" data-id="${c.id}">−</button><span>${c.qty}</span>
        <button data-act="plus" data-id="${c.id}">+</button>
      </div>
    </div>`).join('');
  $('cartList').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    const id=parseInt(b.dataset.id);
    const item=menu.find(x=>x.id===id);
    const c=cart.find(x=>x.id===id);
    if(b.dataset.act==='plus'){ if(c.qty>=item.stok){toast('📦 Stok habis');return;} c.qty++; }
    else { c.qty--; if(c.qty<=0) cart=cart.filter(x=>x.id!==id); }
    renderCart();
  }));
  const total = cart.reduce((s,c)=>s+c.harga*c.qty,0);
  $('cartTotal').textContent = rupiah(total);
}

$('checkoutBtn').addEventListener('click', async ()=>{
  if(cart.length===0){toast('🤙 Keranjang kosong');return;}
  const total = cart.reduce((s,c)=>s+c.harga*c.qty,0);
  for(const c of cart){
    const {data:fresh} = await sb.from('menu_items').select('stok').eq('id',c.id).single();
    if(!fresh || fresh.stok < c.qty){ toast(`📦 ${c.nama} stok berubah`); await loadMenu(); return; }
  }
  for(const c of cart){
    await sb.from('menu_items').update({stok: menu.find(m=>m.id===c.id).stok - c.qty}).eq('id',c.id);
  }
  await sb.from('transactions').insert({
    order_code: 'KSR'+Date.now(),
    customer_name: $('squadName').value.trim() || 'Walk-in',
    items: cart.map(c=>({id:c.id,nama:c.nama,emoji:c.emoji,harga:c.harga,qty:c.qty})),
    total, status:'completed', kasir: staff.name
  });
  cart=[]; $('squadName').value=''; renderCart(); await loadMenu(); await renderRiwayat();
  toast('✅ Transaksi tersimpan!');
});

// ============ KELOLA MENU (admin/owner) ============
function renderMenuManage(){
  $('menuManageList').innerHTML = menu.map(m=>`
    <div class="menurow" data-id="${m.id}">
      <input class="em-in" value="${m.emoji||''}" data-field="emoji">
      <input value="${m.nama}" data-field="nama">
      <input class="num" type="number" value="${m.harga}" data-field="harga">
      <input class="num" type="number" value="${m.stok}" data-field="stok">
      <button class="btn ghost small-btn" data-act="save" style="padding:8px 12px;font-size:11px">Simpan</button>
      <button class="btn danger" data-act="${m.aktif?'nonaktif':'aktif'}" style="padding:8px 12px;font-size:11px">${m.aktif?'Nonaktifkan':'Aktifkan'}</button>
    </div>
  `).join('');
  $('menuManageList').querySelectorAll('.menurow').forEach(row=>{
    const id = parseInt(row.dataset.id);
    row.querySelector('[data-act="save"]').addEventListener('click', async ()=>{
      const emoji = row.querySelector('[data-field="emoji"]').value.trim();
      const nama = row.querySelector('[data-field="nama"]').value.trim();
      const harga = parseInt(row.querySelector('[data-field="harga"]').value)||0;
      const stok = parseInt(row.querySelector('[data-field="stok"]').value)||0;
      const {error} = await sb.from('menu_items').update({emoji,nama,harga,stok}).eq('id',id);
      if(error){toast('❌ Gagal simpan');return;}
      toast('✅ Menu diupdate'); await loadMenu(); renderMenuManage();
    });
    const toggleBtn = row.querySelector('[data-act="nonaktif"], [data-act="aktif"]');
    toggleBtn.addEventListener('click', async ()=>{
      const item = menu.find(m=>m.id===id);
      const {error} = await sb.from('menu_items').update({aktif: !item.aktif}).eq('id',id);
      if(error){toast('❌ Gagal ubah status');return;}
      toast(item.aktif ? '🚫 Menu dinonaktifkan' : '✅ Menu diaktifkan');
      await loadMenu(); renderMenuManage();
    });
  });
}

$('addMenuBtn').addEventListener('click', async ()=>{
  const emoji=$('newEmoji').value.trim()||'🍽️';
  const nama=$('newNama').value.trim();
  const harga=parseInt($('newHarga').value)||0;
  const stok=parseInt($('newStok').value)||0;
  if(!nama||harga<=0){toast('⚠️ Isi nama & harga menu');return;}
  const {error} = await sb.from('menu_items').insert({emoji,nama,harga,stok,aktif:true});
  if(error){toast('❌ Gagal tambah: '+error.message);return;}
  $('newEmoji').value='';$('newNama').value='';$('newHarga').value='';$('newStok').value='';
  toast('✅ Menu ditambahkan!');
  await loadMenu(); renderMenuManage();
});

// ============ RIWAYAT ============
async function renderRiwayat(){
  const {data} = await sb.from('transactions').select('*').order('created_at',{ascending:false}).limit(50);
  if(!data || data.length===0){ $('riwayatArea').innerHTML='<p class="tag">Belum ada transaksi</p>'; return; }
  $('riwayatArea').innerHTML = data.map(t=>{
    const d=new Date(t.created_at);
    return `<div class="cart-line"><span>${d.toLocaleString('id-ID')} • ${t.customer_name||'Walk-in'} • ${t.kasir||'-'}</span><span style="margin-left:auto;font-weight:900;color:var(--a1)">${rupiah(t.total)}</span></div>`;
  }).join('');
}
</script>
</body>
</html>
